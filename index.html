                                  className={`p-4 rounded-2xl border text-left font-medium transition flex items-center justify-between text-xs ${
                                    isSelected
                                      ? 'bg-emerald-600 text-white border-emerald-400 shadow-xl'
                                      : 'bg-slate-950 hover:bg-slate-800 text-slate-200 border-slate-800'
                                  } ${studentSubmitted && !isSelected ? 'opacity-40' : ''}`}
                                >
                                  <div className="flex items-center gap-3">
                                    <span className="w-7 h-7 rounded-full bg-slate-800 text-slate-200 text-xs font-bold flex items-center justify-center">
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <span>{opt}</span>
                                  </div>
                                  {isSelected && <i data-lucide="check-circle-2" className="w-5 h-5 text-white"></i>}
                                </button>
                              );
                            })}
                          </div>
                        )}

                        {/* Subjective Input */}
                        {questions[session.activeQuestionIndex].type === 'subjective' && (
                          <div className="space-y-3">
                            <textarea
                              rows={4}
                              disabled={studentSubmitted || session.questionState !== 'active'}
                              placeholder="Type your biological explanation here..."
                              value={studentAnswer}
                              onChange={(e) => setStudentAnswer(e.target.value)}
                              className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                            />
                            <button
                              disabled={studentSubmitted || !studentAnswer.trim() || session.questionState !== 'active'}
                              onClick={() => handleStudentSubmit(studentAnswer)}
                              className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-3 rounded-2xl transition text-xs shadow-lg"
                            >
                              {studentSubmitted ? 'Answer Submitted!' : 'Submit Biological Answer'}
                            </button>
                          </div>
                        )}

                        {/* Feedback Banner */}
                        {studentFeedback && (
                          <div className={`p-4 rounded-2xl border flex items-center justify-between ${
                            studentFeedback.isCorrect ? 'bg-emerald-950/90 border-emerald-500/80 text-emerald-200' : 'bg-rose-950/90 border-rose-500/80 text-rose-200'
                          }`}>
                            <div className="flex items-center gap-3">
                              <i data-lucide={studentFeedback.isCorrect ? 'check-circle' : 'x-circle'} className="w-6 h-6"></i>
                              <div>
                                <div className="font-bold text-xs">{studentFeedback.message}</div>
                                <div className="text-[11px] opacity-80 mt-0.5">Your Current Competition Rank: #{studentFeedback.rank}</div>
                              </div>
                            </div>
                          </div>
                        )}

                      </div>
                    ) : (
                      <div className="py-16 text-center text-slate-400 space-y-3">
                        <i data-lucide="sparkles" className="w-10 h-10 text-emerald-400 mx-auto animate-pulse"></i>
                        <p className="text-sm font-semibold text-slate-200">Waiting for Soumendra Sir to broadcast the question...</p>
                        <p className="text-xs text-slate-500">Get ready! Live questions with diagrams will automatically appear here.</p>
                      </div>
                    )}

                    {/* Live Leaderboard for Student */}
                    <div className="pt-6 border-t border-slate-800 space-y-3">
                      <h4 className="font-bold text-slate-200 text-xs uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="trophy" className="w-4 h-4 text-amber-400"></i>
                        <span>Live Class Competition Ranks</span>
                      </h4>
                      <div className="space-y-1.5 custom-scrollbar max-h-48 overflow-y-auto pr-1">
                        {sortedLeaderboard.slice(0, 10).map((st, rankIdx) => (
                          <div
                            key={st.id}
                            className={`p-2.5 rounded-xl border flex items-center justify-between text-xs ${
                              st.id === studentProfile.id || st.isCurrentUser ? 'bg-emerald-950/60 border-emerald-500 font-bold' : 'bg-slate-950 border-slate-800'
                            }`}
                          >
                            <div className="flex items-center gap-2.5">
                              <span className="font-mono text-slate-400 text-xs">#{rankIdx + 1}</span>
                              <span>{st.avatar}</span>
                              <span className="text-slate-100">{st.name}</span>
                              {(st.id === studentProfile.id || st.isCurrentUser) && (
                                <span className="bg-emerald-600 text-white text-[9px] px-2 py-0.5 rounded-full font-extrabold">YOU</span>
                              )}
                            </div>
                            <span className="font-mono font-bold text-emerald-400">{st.score} pts</span>
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
